name: Mercari Watch

on:
  schedule:
    # 每 3 分钟。GitHub 调度实际触发可能延迟至 15 分钟(平台特性),
    # 更密的 cron + concurrency 串行能把实际间隔压到约 5~8 分钟。
    - cron: '*/3 * * * *'
  workflow_dispatch:        # 手动触发

# 需要写权限以持久化 seen.json(去重状态)
permissions:
  contents: write

# 并发控制:同一仓库同时只跑一个 run。cancel-in-progress 必须为 false:
# 若取消仍在执行的任务,可能已发出通知但未持久化 seen.json,导致重复通知。
concurrency:
  group: mercari-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 兜底超时:任何卡住都会在 10 分钟后终止,避免默认 6 小时阻塞后续调度
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # 浏览器:runner 自带 Chrome(channel: 'chrome'),无需 playwright install
      # (--with-deps 的 apt 安装在此环境常因镜像源超时失败)

      # 校验至少一个远程通知渠道已配置(CI 无桌面通知,缺 SCT_KEY 则全程假成功)
      - name: Verify notification secret
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: |
          if [ -z "$SCT_KEY" ]; then
            echo "::error::SCT_KEY secret not configured. Add it in repo Settings → Secrets."
            exit 1
          fi
          echo "SCT_KEY configured ✓"

      # PROXY=direct 直连;SCT_KEY/DPOP 从 Secrets 注入
      - name: Run watch
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          DPOP: ${{ secrets.DPOP }}
          PROXY: direct
        run: node mercari-watch.js

      # 去重状态持久化:把 seen.json 的变化提交回仓库(下次 run 继续去重)。
      # seen.json 已在 .gitignore,须用 -f 强制 add。
      - name: Persist seen state
        run: |
          if [ -f seen.json ] && [ -s seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f seen.json
            git diff --cached --quiet || git commit -m "chore: update seen state [skip ci]"
            git push
          else
            echo "seen.json 不存在或为空,跳过持久化"
          fi
